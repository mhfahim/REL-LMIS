<!-- @dsCard group="Colors" viewport="700x150" name="Chart Palette" subtitle="Five-color categorical sequence for data viz" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 24px; display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 110px; height: 56px; border-radius: var(--radius-md); }
  .nm { font-size: 12px; font-weight: 600; color: var(--foreground); }
</style>
</head>
<body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:var(--chart-1)"></div><span class="nm">Chart 1</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-2)"></div><span class="nm">Chart 2</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-3)"></div><span class="nm">Chart 3</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-4)"></div><span class="nm">Chart 4</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-5)"></div><span class="nm">Chart 5</span></div>
</div>
</body>
</html>
