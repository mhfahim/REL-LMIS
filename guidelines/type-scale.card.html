<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="Inter — display through caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-size: 11px; font-family: var(--font-mono); color: var(--muted-foreground); width: 90px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="meta">36 / 700</span><span style="font-size:var(--text-4xl);font-weight:700;letter-spacing:-0.02em;line-height:1.1">Sample throughput</span></div>
  <div class="row"><span class="meta">30 / 700</span><span style="font-size:var(--text-3xl);font-weight:700;letter-spacing:-0.02em">Batch overview</span></div>
  <div class="row"><span class="meta">24 / 600</span><span style="font-size:var(--text-2xl);font-weight:600;letter-spacing:-0.01em">Section heading</span></div>
  <div class="row"><span class="meta">18 / 600</span><span style="font-size:var(--text-lg);font-weight:600">Card title</span></div>
  <div class="row"><span class="meta">14 / 400</span><span style="font-size:var(--text-sm)">Body text — the default size for tables, forms, and descriptions.</span></div>
  <div class="row"><span class="meta">12 / 500</span><span style="font-size:var(--text-xs);font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:0.04em">Caption / label</span></div>
</div>
</body>
</html>
