<!-- @dsCard group="Type" viewport="700x150" name="Mono & Weights" subtitle="Geist Mono for data; Inter weight range" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .weights { display: flex; gap: 24px; align-items: baseline; }
  .w { display: flex; flex-direction: column; gap: 2px; }
  .lbl { font-size: 11px; color: var(--muted-foreground); }
  .mono { font-family: var(--font-mono); font-size: 15px; background: var(--muted); padding: 10px 14px; border-radius: var(--radius-md); display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="weights">
    <div class="w"><span style="font-size:22px;font-weight:400">Aa</span><span class="lbl">Regular 400</span></div>
    <div class="w"><span style="font-size:22px;font-weight:500">Aa</span><span class="lbl">Medium 500</span></div>
    <div class="w"><span style="font-size:22px;font-weight:600">Aa</span><span class="lbl">Semibold 600</span></div>
    <div class="w"><span style="font-size:22px;font-weight:700">Aa</span><span class="lbl">Bold 700</span></div>
  </div>
  <div><span class="mono">RL-20471 · pH 7.38 · 99.2 mg/dL · 14:02:51</span></div>
</div>
</body>
</html>
