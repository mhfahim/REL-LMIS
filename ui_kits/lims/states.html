<!-- @dsCard group="Reliance LIMS" viewport="1280x720" name="System States" subtitle="Empty, loading, error, no-result, permission-denied, import & report failures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reliance LIMS — System States</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--muted); }
  * { box-sizing: border-box; }
  .lims-table tbody tr:hover td { background: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, CardContent, Button, Icon, Skeleton, Table, TableHeader, TableBody, TableRow, TableHead, TableCell } = window.RelianceLIMSDesignSystem_12526c;

function StateCard({ label, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ fontSize: 12, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", color: "var(--muted-foreground)" }}>{label}</div>
      <Card style={{ height: 240 }}><CardContent style={{ padding: 0, height: "100%", display: "flex", flexDirection: "column" }}>{children}</CardContent></Card>
    </div>
  );
}

function Centered({ icon, iconTone, title, detail, actionLabel, secondaryLabel }) {
  const tones = {
    neutral: { bg: "var(--muted)", fg: "var(--muted-foreground)" },
    danger: { bg: "rgba(220,38,38,0.10)", fg: "var(--destructive)" },
    warning: { bg: "rgba(217,119,6,0.12)", fg: "var(--warning)" },
  };
  const t = tones[iconTone] || tones.neutral;
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", gap: 10, padding: 24, fontFamily: "var(--font-sans)" }}>
      <span style={{ width: 48, height: 48, borderRadius: "var(--radius-lg)", background: t.bg, color: t.fg, display: "inline-flex", alignItems: "center", justifyContent: "center" }}><Icon name={icon} size={22} /></span>
      <div style={{ fontSize: 15, fontWeight: 600 }}>{title}</div>
      <div style={{ fontSize: 13, color: "var(--muted-foreground)", maxWidth: 340, lineHeight: "var(--leading-normal)" }}>{detail}</div>
      <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
        {actionLabel ? <Button variant="default" size="sm">{actionLabel}</Button> : null}
        {secondaryLabel ? <Button variant="outline" size="sm">{secondaryLabel}</Button> : null}
      </div>
    </div>
  );
}

function LoadingRows() {
  return (
    <div style={{ padding: 16, flex: 1 }}>
      {Array.from({ length: 5 }).map((_, r) => (
        <div key={r} style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 16, padding: "11px 0", borderBottom: "1px solid var(--border)" }}>
          {Array.from({ length: 5 }).map((_, c) => <Skeleton key={c} width={c === 0 ? "70%" : "55%"} height={13} />)}
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <div style={{ padding: 28, fontFamily: "var(--font-sans)" }}>
      <h1 style={{ margin: "0 0 4px", fontSize: 22, fontWeight: 700, letterSpacing: "-0.02em" }}>System states</h1>
      <p style={{ margin: "0 0 24px", fontSize: 13.5, color: "var(--muted-foreground)" }}>Reusable empty, loading, and error states — simple, helpful, and action-oriented.</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 20 }}>
        <StateCard label="Empty table">
          <Centered icon="folder" title="No records yet" detail="No dags have been added to this mouza. Add your first record to get started." actionLabel="Add record" />
        </StateCard>
        <StateCard label="Loading table"><LoadingRows /></StateCard>
        <StateCard label="Error">
          <Centered icon="alert-circle" iconTone="danger" title="Couldn't load data" detail="The registry service didn't respond. Check your connection and try again." actionLabel="Retry" />
        </StateCard>
        <StateCard label="No search result">
          <Centered icon="search" title="No results found" detail="No dags match “DAG-9999”. Try a different dag, deed, or mouza." secondaryLabel="Clear search" />
        </StateCard>
        <StateCard label="Permission denied">
          <Centered icon="lock" iconTone="danger" title="Access restricted" detail="Your role doesn't have permission to view this module. Contact an administrator." secondaryLabel="Request access" />
        </StateCard>
        <StateCard label="Import failed">
          <Centered icon="x-circle" iconTone="danger" title="Import failed" detail="The Excel import was rolled back — 312 rows failed validation. No records were changed." actionLabel="View errors" secondaryLabel="Retry import" />
        </StateCard>
        <StateCard label="Report generation failed">
          <Centered icon="alert-triangle" iconTone="warning" title="Report didn't generate" detail="The Dag-wise Ledger timed out. Narrow the date range or try again." actionLabel="Try again" />
        </StateCard>
        <StateCard label="No notifications">
          <Centered icon="bell" title="You're all caught up" detail="No new alerts or reminders right now." />
        </StateCard>
        <StateCard label="Offline / connection lost">
          <Centered icon="refresh-cw" iconTone="warning" title="Connection lost" detail="You're offline. Changes will sync when the connection is restored." secondaryLabel="Reconnect" />
        </StateCard>
      </div>
    </div>
  );
}
function mount() {
  if (!window.RelianceLIMSDesignSystem_12526c) { setTimeout(mount, 40); return; }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
mount();
</script>
</body>
</html>
