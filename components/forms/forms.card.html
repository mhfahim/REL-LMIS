<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  #root { padding: 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Input, Select, Checkbox, Switch, Slider, RadioGroup, RadioGroupItem, Label, Icon } = window.RelianceLIMSDesignSystem_12526c;
function Demo() {
  return (
    <div>
      <div className="lbl">Buttons</div>
      <div className="row">
        <Button>Save record</Button>
        <Button variant="secondary">Secondary</Button>
        <Button variant="outline">Outline</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="brand">Brand</Button>
        <Button variant="destructive">Delete</Button>
        <Button variant="outline" size="icon"><Icon name="more-horizontal" size={16} /></Button>
        <Button disabled>Disabled</Button>
      </div>
      <div className="row" style={{ alignItems: "flex-end" }}>
        <div className="grp" style={{ width: 200 }}>
          <Label htmlFor="sid">Dag no.</Label>
          <Input id="sid" placeholder="e.g. DAG-1184" />
        </div>
        <div className="grp" style={{ width: 200 }}>
          <Label>Transaction type</Label>
          <Select placeholder="Choose type" options={[{value:"purchase",label:"Purchase"},{value:"sale",label:"Sale"},{value:"awaz",label:"Awaz"}]} />
        </div>
      </div>
      <div className="row">
        <Label><Checkbox defaultChecked /> Verified</Label>
        <Label><Checkbox indeterminate /> Partial</Label>
        <RadioGroup defaultValue="agri" style={{ flexDirection: "row", gap: 16 }}>
          <Label><RadioGroupItem value="agri" /> Agricultural</Label>
          <Label><RadioGroupItem value="bastu" /> Homestead</Label>
        </RadioGroup>
        <Label><Switch defaultChecked /> Auto-flag</Label>
        <div style={{ width: 160 }}><Slider defaultValue={64} /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
