    <React.Fragment>

      <DropdownMenu align="start" trigger={<Button variant="outline">Actions <Icon name="chevron-down" size={14}/></Button>}

          { separator: true },

        ]} />

        <DialogFooter>
          <Button variant="outline" onClick={() => setOpen(false)}>Cancel</Button>
          <Button variant="destructive" onClick={() => setOpen(false)}>Delete</Button>
        </DialogFooter>
      </Dialog>

}
